name: FRONTERA - verificar actualizacion v4 a v5 Android
on:
  push:
    branches:
      - experiment/frontera-native-shell
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontera-native-upgrade
  cancel-in-progress: true
jobs:
  update-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar misma app codes 4 y 5 usando la misma firma debug
        run: |
          set -euo pipefail
          unzip -q ci/frontera-native-0.1.4-source.zip -d native
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          cp native/app/build.gradle /tmp/build-v5.gradle
          cp native/app/src/main/java/cl/nazaret/fronteradefuego/LauncherActivity.java /tmp/activity-v5.java
          sed -i "s/versionCode 5/versionCode 4/;s/versionName '0.1.4'/versionName '0.1.3'/" native/app/build.gradle
          sed -i 's/APP_CODE = 5/APP_CODE = 4/' native/app/src/main/java/cl/nazaret/fronteradefuego/LauncherActivity.java
          (cd native && gradle --no-daemon :app:assembleDebug)
          cp native/app/build/outputs/apk/debug/app-debug.apk ci/native-v4-debug.apk
          cp /tmp/build-v5.gradle native/app/build.gradle
          cp /tmp/activity-v5.java native/app/src/main/java/cl/nazaret/fronteradefuego/LauncherActivity.java
          (cd native && gradle --no-daemon :app:assembleDebug)
          cp native/app/build/outputs/apk/debug/app-debug.apk ci/native-v5-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs ci/native-v4-debug.apk > signature-v4.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs ci/native-v5-debug.apk > signature-v5.txt
          diff signature-v4.txt signature-v5.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ci/native-v4-debug.apk | grep -F "versionCode='4'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ci/native-v5-debug.apk | grep -F "versionCode='5'"
      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verificar actualizador firmado y conservar preferencias al subir version
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/frontera-native-update-e2e.sh
      - name: Guardar evidencias de actualizacion
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontera-actualizacion-4-a-5-evidencias
          path: |
            ci/native-v4-debug.apk
            ci/native-v5-debug.apk
            signature-v4.txt
            signature-v5.txt
            native-*.xml
            native-*.png
          if-no-files-found: warn
          retention-days: 14
