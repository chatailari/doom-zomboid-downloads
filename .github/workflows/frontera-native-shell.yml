name: FRONTERA - base Android nativa, compilar y probar
on:
  push:
    branches:
      - experiment/frontera-native-shell
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontera-native
  cancel-in-progress: true
jobs:
  android-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verificar fuente y compilar APK nativa
        run: |
          set -euo pipefail
          unzip -q ci/frontera-native-0.1.4-source.zip -d native
          python3 native/scripts/verify_source.py
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          cd native
          gradle --no-daemon :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > ../native-debug.sha256
      - name: Habilitar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar visualización y botón ACTUALIZAR en Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/frontera-native-smoke.sh
      - name: Guardar pruebas aunque fallen
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontera-0.1.4-native-ci
          path: |
            native/app/build/outputs/apk/debug/*.apk
            native-debug.sha256
            native-ui.xml
            native-update-ui.xml
            native-home.png
            native-update.png
            native-emulator-focus.txt
            native-logcat.txt
          if-no-files-found: warn
          retention-days: 14
