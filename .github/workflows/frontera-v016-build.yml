name: FRONTERA 0.1.6 - Compilar animación ambiental
on:
  push:
    branches:
      - staging/frontera-v0.1.6-ci
    paths:
      - 'frontera-de-fuego/v0.1.6/**'
      - '.github/workflows/frontera-v016-build.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Extract and verify source, with no private signing keys
        run: |
          set -euo pipefail
          mkdir -p /tmp/frontera-v016
          cat frontera-de-fuego/v0.1.6/part_*.txt | base64 -d > /tmp/frontera-v016.zip
          echo 'd132830ba81c78f7ed14b58b28e57868af75c5f459ae4c745fc4c879f00477e1  /tmp/frontera-v016.zip' | sha256sum -c -
          unzip -q /tmp/frontera-v016.zip -d /tmp/frontera-v016
          python3 /tmp/frontera-v016/scripts/verify_source.py
          python3 /tmp/frontera-v016/scripts/test_updater_security.py
      - name: Assemble 0.1.6 Android release APK (unsigned only)
        run: |
          set -euo pipefail
          gradle --no-daemon --project-dir /tmp/frontera-v016 :app:assembleRelease
          test -s /tmp/frontera-v016/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/frontera-v016/app/build/outputs/apk/release/app-release-unsigned.apk | grep "versionCode='7' versionName='0.1.6'"
      - name: Preserve compiled unsigned APK for offline private-signing gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontera-016-unsigned-not-for-install
          path: /tmp/frontera-v016/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 7