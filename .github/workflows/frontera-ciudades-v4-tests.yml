name: Frontera v4 - ciudades y guerras CI
on:
  push:
    branches:
      - feature/frontera-ciudades-v04
    paths:
      - 'frontera-de-fuego/estrategia-v4/**'
      - '.github/workflows/frontera-ciudades-v4-tests.yml'
  pull_request:
    paths:
      - 'frontera-de-fuego/estrategia-v4/**'
      - '.github/workflows/frontera-ciudades-v4-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar economía y narración
        run: node --test frontera-de-fuego/estrategia-v4/test_story.mjs frontera-de-fuego/estrategia-v4/test_settlement.mjs
      - name: Construir juego autocontenido
        run: python3 frontera-de-fuego/estrategia-v4/build_story_offline.py
      - name: Verificar archivo offline y compatibilidad histórica
        run: |
          test -s frontera-de-fuego/estrategia-v4/juego_offline.html
          grep -q 'frontera_defuego_historia_guiada_v3' frontera-de-fuego/estrategia-v4/juego_offline.html
          grep -q 'frontera_defuego_ciudades_v4' frontera-de-fuego/estrategia-v4/juego_offline.html
          ! grep -q '<script type="module">' frontera-de-fuego/estrategia-v4/juego_offline.html
          grep -q 'frontera_defuego_estrategia_save_v2' frontera-de-fuego/estrategia-v4/clasico.html