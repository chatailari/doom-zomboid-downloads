# Propuestas automáticas, nunca instalar cambios sin que aprueben los tests.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Santiago"
    open-pull-requests-limit: 3
    groups:
      acciones:
        patterns:
          - "*"
